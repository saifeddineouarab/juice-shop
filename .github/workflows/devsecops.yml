name: DevSecOps Pipeline (SAST - SCA - DAST)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  security-events: write

jobs:
  # ==========================================
  # JOB 1 : SAST (Static Application Security Testing)
  # ==========================================
  sast-semgrep:
    name: 1. SAST - Semgrep Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare reports directory
        run: mkdir -p reports && chmod 777 reports

      - name: Run Semgrep SAST
        run: |
          docker run --rm --user root -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep \
            semgrep scan --config p/security-audit --metrics=off \
            --json --output /src/reports/semgrep-report.json \
            routes models lib frontend/src || true

          docker run --rm --user root -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep \
            semgrep scan --config p/security-audit --metrics=off \
            --sarif --output /src/reports/semgrep-report.sarif \
            routes models lib frontend/src || true

      - name: Upload SAST Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-semgrep-reports
          path: reports/
          if-no-files-found: error

  # ==========================================
  # JOB 2 : SCA (Software Composition Analysis)
  # ==========================================
  sca-grype:
    name: 2. SCA - Grype Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Grype SCA Scan
        run: |
          grype dir:. -o json --file reports/grype-report.json
          grype dir:. -o sarif --file reports/grype-report.sarif

      - name: Upload SCA Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-grype-reports
          path: reports/
          if-no-files-found: error

  # ==========================================
  # JOB 3 : DAST (Dynamic Application Security Testing)
  # ==========================================
  dast-zap:
    name: 3. DAST - OWASP ZAP Scan
    runs-on: ubuntu-latest
    steps:
      - name: Prepare reports directory
        run: mkdir -p reports && chmod 777 reports

      - name: Start Juice Shop Test Environment
        run: |
          docker run -d --name juice-shop-test -p 3000:3000 bkimminich/juice-shop
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Juice Shop est prêt sur http://localhost:3000 !"
              break
            fi
            sleep 2
          done

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm --network="host" \
            -v "${{ github.workspace }}/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:3000 \
            -J zap-report.json \
            -r zap-report.html || true

      - name: Stop Test Environment
        if: always()
        run: docker stop juice-shop-test && docker rm juice-shop-test || true

      - name: Upload DAST Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-reports
          path: reports/
          if-no-files-found: error

  # ==========================================
  # JOB 4 : BARRIÈRE DE SÉCURITÉ BLOQUANTE (SECURITY GATE)
  # ==========================================
  security-gate:
    name: 4. Security Gate (Barrière Bloquante)
    runs-on: ubuntu-latest
    needs: [sast-semgrep, sca-grype, dast-zap]
    steps:
      - name: Download all security reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Evaluate Security Thresholds
        run: |
          echo "=== ÉVALUATION DE LA BARRIÈRE DE SÉCURITÉ ==="

          # 1. Comptage SAST (Semgrep : sévérité ERROR = High/Critical)
          SAST_ERRORS=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' all-reports/sast-semgrep-reports/semgrep-report.json)
          SAST_WARNINGS=$(jq '[.results[] | select(.extra.severity == "WARNING")] | length' all-reports/sast-semgrep-reports/semgrep-report.json)

          # 2. Comptage SCA (Grype : Critical + High)
          SCA_CRIT_HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "Critical" or .vulnerability.severity == "High")] | length' all-reports/sca-grype-reports/grype-report.json)

          # 3. Comptage DAST (OWASP ZAP : riskcode 3 = High, riskcode 2 = Medium)
          DAST_HIGH=$(jq '[.site[0].alerts[] | select(.riskcode == "3")] | length' all-reports/dast-zap-reports/zap-report.json)
          DAST_MEDIUM=$(jq '[.site[0].alerts[] | select(.riskcode == "2")] | length' all-reports/dast-zap-reports/zap-report.json)

          echo "------------------------------------------------"
          echo "SAST (Semgrep) -> Errors (High): $SAST_ERRORS | Warnings (Medium): $SAST_WARNINGS"
          echo "SCA  (Grype)   -> Critical/High CVEs: $SCA_CRIT_HIGH"
          echo "DAST (ZAP)     -> High Alerts: $DAST_HIGH | Medium Alerts: $DAST_MEDIUM"
          echo "------------------------------------------------"

          # Politique de blocage (Seuil strict : 0 SAST Error, 0 SCA Crit/High, 0 DAST High/Medium)
          if [ "$SAST_ERRORS" -gt 0 ] || [ "$SCA_CRIT_HIGH" -gt 0 ] || [ "$DAST_HIGH" -gt 0 ] || [ "$DAST_MEDIUM" -gt 0 ]; then
            echo "❌ ÉCHEC DE LA BARRIÈRE DE SÉCURITÉ : Seuils de vulnérabilités dépassés ! Déploiement bloqué."
            exit 1
          else
            echo "✅ BARRIÈRE DE SÉCURITÉ VALIDÉE : Aucune vulnérabilité critique détectée."
            exit 0
          fi
